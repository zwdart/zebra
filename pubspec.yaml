name: zebra
description: "A Flutter SSH client with SFTP and terminal support."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.28
  provider: ^6.1.2
  dartssh2: ^2.8.2
  xterm: ^4.0.0
  file_picker: ^8.1.7
  path: ^1.9.0
  shared_preferences: ^2.3.4
  desktop_drop: ^0.5.0
  archive: ^3.6.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
