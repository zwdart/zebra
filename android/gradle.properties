# GitHub Actions ubuntu-latest 仅 7GB 内存 / 4 核,-Xmx8G 严重超配,
# 叠加 Kotlin daemon + dart 进程会触发 runner 内存压力被 SIGTERM 取消(exit 143)
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# 限制 Gradle worker 数,避免单核机器上并发任务把内存/CPU 打满(社区验证可修复 "operation was canceled")
org.gradle.workers.max=4
android.useAndroidX=true
