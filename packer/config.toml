# Zebra API Server 配置文件
# 修改后重启服务生效

# 监听端口，默认 8686
port = 8686

# 下载 URL 前缀域名，normalize_download_url 时使用
domain = "zebra.dart.xin"

# 数据存储根目录（包含 versions.db、uploads、logs）
data_dir = "runtimes"

# 静态文件目录（admin.html 所在目录）
static_dir = "static"

# HTTP 日志单条最大字节数（headers/body），超出截断。0 = 不限制，默认 2048
log_max_bytes = 2048

# 管理员用户名
admin_username = "admin"
# 管理员密码
admin_password = "zebra2026"

# ===== RSS 抓取间隔配置（分钟）=====
# 抓取任务扫描间隔（分钟），最小 15，默认 15
rss_scan_interval_min = 120
# 订阅源过期重抓时间（分钟），默认 30（距上次抓取超过该值才重新抓取）
rss_fetch_stale_min = 30