server {
    listen 80;
    server_name zebra.dart.xin;

    # 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zebra.dart.xin;

    # ---------- SSL 证书 ----------
    # 请替换为实际的证书路径
    ssl_certificate     /etc/nginx/ssl/zebra.dart.xin.crt;
    ssl_certificate_key /etc/nginx/ssl/zebra.dart.xin.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---------- 日志 ----------
    access_log /var/log/nginx/zebra-api-access.log;
    error_log  /var/log/nginx/zebra-api-error.log;

    # ---------- 反向代理 ----------
    location / {
        proxy_pass         http://127.0.0.1:8686;
        proxy_http_version 1.1;

        # 传递真实客户端 IP
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket 支持（如果后续需要）
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # 大文件上传支持（上传更新文件最大 100MB）
        client_max_body_size 100m;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
