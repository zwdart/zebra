<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zebra SSH - 博客</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #333; line-height: 1.6; }
.header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; padding: 32px 24px; text-align: center; }
.header h1 { font-size: 28px; margin-bottom: 8px; }
.header p { color: rgba(255,255,255,0.7); font-size: 14px; }
.container { max-width: 900px; margin: 32px auto; padding: 0 20px; }
.blog-list { display: grid; gap: 20px; }
.blog-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; cursor: pointer; transition: all 0.2s; border: 1px solid #eee; }
.blog-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); border-color: #1a73e8; }
.blog-card h2 { font-size: 18px; margin-bottom: 8px; color: #1a1a2e; }
.blog-card .summary { color: #666; font-size: 14px; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.blog-card .meta { display: flex; gap: 16px; align-items: center; font-size: 12px; color: #999; }
.blog-card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.blog-card .tag { background: #e8f0fe; color: #1a73e8; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
.empty-state { text-align: center; padding: 64px 20px; color: #999; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.pagination { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 32px 0; }
.pagination button { padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; font-size: 14px; transition: all 0.2s; }
.pagination button:hover:not(:disabled) { background: #f5f5f5; border-color: #999; }
.pagination button.active { background: #1a73e8; color: white; border-color: #1a73e8; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination .page-info { font-size: 14px; color: #666; margin: 0 12px; }

/* Mobile */
@media (max-width: 768px) {
  .header { padding: 24px 16px; }
  .header h1 { font-size: 22px; }
  .container { padding: 0 12px; margin: 16px auto; }
  .blog-card { padding: 16px; }
  .detail-card { padding: 20px; }
  .pagination { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Zebra SSH - 博客</h1>
  <p>技术分享与更新日志</p>
</div>

<div class="container">
  <!-- Blog List -->
  <div class="blog-list-wrap" id="blog-list-wrap">
    <div class="blog-list" id="blog-list"></div>
    <div class="pagination" id="blog-pagination"></div>
  </div>
</div>

<script>
const API = '/api/blog/posts';
let currentPage = 1;
const PAGE_SIZE = 10;
let totalPosts = 0;

async function loadPosts(page) {
  currentPage = page || 1;
  try {
    const res = await fetch(`${API}?page=${currentPage}&size=${PAGE_SIZE}`);
    const json = await res.json();
    totalPosts = json.total || 0;
    const items = json.data || [];
    renderList(items);
    renderPagination();
  } catch (e) {
    document.getElementById('blog-list').innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>加载失败</p></div>';
  }
}

function renderList(items) {
  const el = document.getElementById('blog-list');
  if (!items.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>暂无博客文章</p></div>';
    return;
  }
  el.innerHTML = items.map(p => `
    <a class="blog-card" href="/api/blog/post/${p.id}" style="text-decoration:none;color:inherit;display:block;">
      <h2>${escHtml(p.title)}${p.sort_order > 0 ? ` <span style="font-size:12px;color:#1a73e8;font-weight:normal;">[置顶]</span>` : ''}</h2>
      ${p.summary ? `<div class="summary">${escHtml(p.summary)}</div>` : ''}
      <div class="meta">
        <span>${formatDate(p.created_at)}</span>
        ${p.tags ? `<div class="tags">${p.tags.split(',').map(t => t.trim()).filter(t => t).map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}</div>` : ''}
      </div>
    </a>
  `).join('');
}

function renderPagination() {
  const totalPages = Math.max(1, Math.ceil(totalPosts / PAGE_SIZE));
  const el = document.getElementById('blog-pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }

  let html = `<button ${currentPage<=1?'disabled':''} onclick="loadPosts(1)">首页</button>`;
  html += `<button ${currentPage<=1?'disabled':''} onclick="loadPosts(${currentPage-1})">上一页</button>`;
  const start = Math.max(1, currentPage - 2);
  const end = Math.min(totalPages, currentPage + 2);
  for (let i = start; i <= end; i++) {
    html += `<button class="${i===currentPage?'active':''}" onclick="loadPosts(${i})">${i}</button>`;
  }
  html += `<button ${currentPage>=totalPages?'disabled':''} onclick="loadPosts(${currentPage+1})">下一页</button>`;
  html += `<button ${currentPage>=totalPages?'disabled':''} onclick="loadPosts(${totalPages})">末页</button>`;
  html += `<span class="page-info">共 ${totalPosts} 篇</span>`;
  el.innerHTML = html;
}

function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

loadPosts(1);
</script>
</body>
</html>
