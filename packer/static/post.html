<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客文章</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #333; line-height: 1.6; }
.header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
.header a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; padding: 6px 14px; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; transition: all 0.2s; }
.header a:hover { background: rgba(255,255,255,0.1); color: white; }
.container { max-width: 800px; margin: 32px auto; padding: 0 20px; }
.loading { text-align: center; padding: 64px; color: #999; }
.error { text-align: center; padding: 64px; color: #c62828; }
.post-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 40px; border: 1px solid #eee; }
.post-card h1 { font-size: 28px; margin-bottom: 16px; color: #1a1a2e; line-height: 1.3; }
.post-card .meta { display: flex; gap: 16px; align-items: center; font-size: 13px; color: #999; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
.post-card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.post-card .tag { background: #e8f0fe; color: #1a73e8; padding: 3px 10px; border-radius: 4px; font-size: 12px; }
.post-content { font-size: 16px; line-height: 1.8; color: #333; word-break: break-word; }
.post-content p { margin: 0 0 16px; }
.post-content h1 { font-size: 24px; margin: 24px 0 12px; color: #1a1a2e; }
.post-content h2 { font-size: 20px; margin: 20px 0 10px; color: #1a1a2e; }
.post-content h3 { font-size: 17px; margin: 16px 0 8px; color: #1a1a2e; }
.post-content code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 14px; font-family: 'SF Mono', Monaco, monospace; }
.post-content pre { background: #1a1a2e; color: #e8e8e8; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 16px 0; white-space: pre-wrap; }
.post-content pre code { background: none; padding: 0; color: inherit; font-size: 13px; }
.post-content blockquote { border-left: 4px solid #1a73e8; padding: 8px 16px; margin: 16px 0; color: #555; background: #f8f9fa; border-radius: 0 4px 4px 0; }
.post-content img { max-width: 100%; border-radius: 8px; margin: 16px 0; }
.post-content a { color: #1a73e8; text-decoration: none; }
.post-content a:hover { text-decoration: underline; }
.post-content ul, .post-content ol { padding-left: 24px; margin: 12px 0; }
.post-content li { margin: 6px 0; }
.post-content table { border-collapse: collapse; width: 100%; margin: 16px 0; }
.post-content th, .post-content td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
.post-content th { background: #fafafa; font-weight: 600; }
.post-content hr { border: none; border-top: 1px solid #eee; margin: 24px 0; }
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .container { padding: 0 12px; margin: 16px auto; }
  .post-card { padding: 20px; }
  .post-card h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="header">
  <a href="/api/blog">← 返回博客列表</a>
</div>
<div class="container" id="post-container">
  <div class="loading">加载中...</div>
</div>
<script>
function getPostId() {
  const parts = window.location.pathname.split('/');
  return parts[parts.length - 1];
}

function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  const year = d.getFullYear();
  const month = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  const hours = String(d.getHours()).padStart(2,'0');
  const mins = String(d.getMinutes()).padStart(2,'0');
  return `${year}-${month}-${day} ${hours}:${mins}`;
}

function renderMarkdown(text) {
  if (!text) return '<p style="color:#999;">（暂无内容）</p>';
  // Step 1: Escape HTML
  let s = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Step 2: Fenced code blocks
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Step 3: Inline code
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // Step 4: Bold
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Step 5: Italic (simple single asterisk, not greedy)
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Step 6: Headers (from line start)
  s = s.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Step 7: Horizontal rule
  s = s.replace(/^---+$/gm, '<hr>');
  // Step 8: Images and links
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Step 9: Blockquote
  s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Step 10: Unordered list items
  s = s.replace(/^- (.+)$/gm, '<li>$1</li>');
  // Step 11: Wrap consecutive <li> in <ul>
  s = s.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  // Step 12: Paragraphs — split on double newlines
  const blocks = s.split(/\n{2,}/);
  s = blocks.map(block => {
    block = block.trim();
    if (!block) return '';
    // Don't wrap block elements in <p>
    if (/^<(h[1-4]|pre|ul|ol|blockquote|hr|img|table)/.test(block)) return block;
    // Replace single newlines with <br> inside paragraphs
    block = block.replace(/\n/g, '<br>');
    return '<p>' + block + '</p>';
  }).join('\n');
  return s;
}

async function loadPost() {
  const id = getPostId();
  if (!id || isNaN(id)) {
    document.getElementById('post-container').innerHTML = '<div class="error">文章不存在</div>';
    return;
  }
  try {
    const res = await fetch(`/api/blog/posts/${id}`);
    if (!res.ok) {
      document.getElementById('post-container').innerHTML = '<div class="error">文章不存在或尚未发布</div>';
      return;
    }
    const resp = await res.json();
    if (!resp.success || !resp.data) {
      document.getElementById('post-container').innerHTML = '<div class="error">文章不存在或尚未发布</div>';
      return;
    }
    const post = resp.data;
    document.title = post.title + ' - Zebra SSH 博客';
    const tagsHtml = post.tags ? post.tags.split(',').map(t => t.trim()).filter(t => t).map(t => `<span class="tag">${escHtml(t)}</span>`).join('') : '';
    document.getElementById('post-container').innerHTML = `
      <div class="post-card">
        <h1>${escHtml(post.title)}</h1>
        <div class="meta">
          <span>${formatDate(post.created_at)}</span>
          ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ''}
        </div>
        <div class="post-content">${renderMarkdown(post.content)}</div>
      </div>
    `;
  } catch (e) {
    document.getElementById('post-container').innerHTML = '<div class="error">加载失败，请稍后重试</div>';
  }
}

loadPost();
</script>
</body>
</html>
