# Zebra — 桌面免安装应用自动构建
#
# 触发方式:
#   - push 到 master:构建 Linux/Windows/Android 并上传 Actions Artifact
#   - 打 tag (v*):构建全平台并自动发布 GitHub Release(可直接下载)
#   - 手动触发:Actions 页面 Run workflow
#
# 产物(统一命名 zebra-<平台>-<版本>-<架构>.<ext>,版本号取自 tag 或 pubspec.yaml):
#   - Linux   :
#       * zebra-linux-<ver>-x86_64.zip(免安装单文件 + linux_install.sh 安装脚本)
#       * zebra-linux-<ver>-x86_64.deb(Debian/Ubuntu 原生安装包)
#       * zebra-linux-<ver>-x86_64.rpm(Fedora/RHEL/openSUSE 原生安装包)
#       * zebra-linux-<ver>-x86_64.AppImage(跨发行版便携格式)
#       * zebra-linux-<ver>-x86_64.tar.gz(通用二进制压缩包)
#   - Windows :
#       * zebra-windows-<ver>-x86_64.exe(自解压单文件)
#       * installer/zebra-windows-<ver>-x86_64-setup.exe(Inno Setup 原生安装器)
#   - macOS   : zebra-macos-<ver>-arm64.{zip,dmg,pkg}(Apple Silicon,universal 二进制)
#               + zebra-macos-<ver>-x86_64.{zip,dmg,pkg}(Intel,同一份 universal 产物)
#   - Android : zebra-android-<ver>-universal.apk(全 ABI 合一)
#               + zebra-android-<ver>-{abi}.apk(按 ABI 拆分)
#               + zebra-android-<ver>-universal.aab(上架应用商店)
#   - iOS     : zebra-ios-<ver>-arm64.zip(Runner.app 压缩包)
#               + zebra-ios-<ver>-arm64.ipa(均未签名,需本地签名后安装/上架)
#
# 打包方式:
#   - Linux/Windows:Flutter release 构建 → packer/zebra-pack 压缩进 data.bin →
#     packer/zebra 自解压单文件(免安装版)
#   - macOS:直接分发 Flutter 构建产物 Runner.app(真实 .app,不经自解压壳),
#     dmg/pkg/zip 均基于该真实 bundle 打包
# 原生安装包(.deb/.rpm/.AppImage/.tar.gz/.dmg/.pkg/setup.exe/.ipa)
# 直接基于 Flutter 构建产物打包。
#
# ==================== 操作流程(完整命令) ====================
#
# 一、首次发布(完整流程):
#   1. 提交并推送代码(触发 Linux + Windows 构建)
#      git add -A
#      git commit -m "feat: 你的改动说明"
#      git push origin master
#   2. 等待构建完成(约 15~25 分钟),在仓库 Actions 页面
#      点最新一次 run,底部 Artifacts 可下载 Linux/Windows 包
#   3. 打 tag 并推送(触发 macOS 构建 + 自动发 Release)
#      git tag -a v1.0.0 -m "release v1.0.0"
#      git push origin v1.0.0
#   4. 等 macOS 构建完成(约 25~35 分钟),到仓库 Releases 页面
#      下载三平台安装包(长期可下载的正式入口)
#
# 二、日常更新版本:
#   1. git add -A && git commit -m "..." && git push origin master
#   2. git tag -a v1.0.1 -m "release v1.0.1" && git push origin v1.0.1
#   3. 版本号按语义化递增:v1.0.0 → v1.0.1 → v1.1.0 → v2.0.0
#
# 三、只想手动构建一次(不发布):
#   Actions 页面 → Build Desktop Apps → Run workflow
#   (手动触发会构建三平台,但不会发 Release,产物只在 Artifacts 里)
#
# ==================== 注意事项 ====================
#   1. git tag 只存在本地,必须 git push origin <tag> 推送后 GitHub 才认;
#      用 git ls-remote --tags origin 可验证是否真的推送成功。
#   2. tag 触发是"另一次独立 run",与 push master 那次互不干扰;
#      判定依据是 github.ref:分支为 refs/heads/master,tag 为 refs/tags/v*。
#   3. tag 必须打在要发布的 commit 上:先 push master 再打 tag,
#      否则 tag 指向的提交里没有最新代码。
#   4. tag 名必须以 v 开头(如 v1.0.0),否则不会触发本工作流。
#   5. macOS 平时 push 不构建(macOS runner 分钟数按 10 倍扣私有仓库额度),
#      只有打 tag 或手动触发时才跑。
#   6. 打错 tag 的删除方法:
#      git tag -d v1.0.0 && git push origin :v1.0.0
#   7. 已发布的 tag 不要覆盖,改代码请递增版本号,避免 Release 混乱。
#   8. 首次配置完本文件后,记得先 commit + push 到 master,
#      否则工作流尚未生效(文件只在本地/暂存区)。
name: Build Desktop Apps

# ==================== 版本锁定 ====================
# CI 工具链版本固定,避免上游升级导致构建行为漂移
# (曾因 Flutter 参数变动导致构建失败,锁定后结果可复现)。
# 升级版本时同步更新此处,并确认三平台构建通过。
env:
  FLUTTER_VERSION: "3.41.6" # 与 runner 实际缓存的 stable 版本一致(stable-3.41.6-arm64)
  RUST_VERSION: "1.91.1"    # packer 为纯 Rust 项目,无特殊 MSRV 要求

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ==================== Linux ====================
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev
          # linuxdeploy-plugin-gtk 生成 immodules/pixbuf 缓存所需工具
          # (libgdk-pixbuf-2.0-bin 是 24.04 的包名,22.04 是 libgdk-pixbuf2.0-bin,失败则回退)
          sudo apt-get install -y libgtk-3-bin libgdk-pixbuf-2.0-bin || \
            sudo apt-get install -y libgtk-3-bin libgdk-pixbuf2.0-bin

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - name: Generate build info
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > lib/build_info.dart << EOF
          // Auto-generated build info - overwritten by build scripts
          const String buildTime = '$BUILD_TIME';
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter Linux release
        run: flutter build linux --release

      - name: Pack single-file binary
        run: |
          cd packer
          cargo build --release --bin zebra-pack
          target/release/zebra-pack -f ../build/linux/x64/release/bundle -e zebra -n zebra-ssh
          cargo build --release --bin zebra

      - name: Prepare packaging version
        id: pkgver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          fi
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Create install zip (zebra + linux_install.sh)
        run: |
          cd packer/target/release
          cp "$GITHUB_WORKSPACE/linux_install.sh" ./linux_install.sh
          chmod +x ./linux_install.sh
          zip -j zebra-linux-${{ steps.pkgver.outputs.version }}-x86_64.zip linux_install.sh zebra

      - name: Build .deb package
        run: |
          VERSION="${{ steps.pkgver.outputs.version }}"
          BUNDLE="build/linux/x64/release/bundle"
          ROOT="pkg/zebra-deb"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons/hicolor" "$ROOT/opt/zebra"
          cp -r "$BUNDLE/." "$ROOT/opt/zebra/"
          ln -s /opt/zebra/zebra "$ROOT/usr/bin/zebra"
          # 安装多尺寸 hicolor 图标(尺寸与目录匹配),桌面环境按需选择;
          # 此前把 128x128 图标塞进 256x256/apps 目录,尺寸不匹配且无 postinst 刷新缓存,
          # 导致 GNOME/KDE 等按缓存查询图标时显示不出来
          for size in 16 24 32 48 64 128 256 512; do
            if [ -f "linux/icons/icon_${size}.png" ]; then
              mkdir -p "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps"
              cp "linux/icons/icon_${size}.png" "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps/zebra.png"
            fi
          done
          cat > "$ROOT/usr/share/applications/zebra.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Zebra
          Comment=Zebra Desktop App
          Exec=/opt/zebra/zebra
          Icon=zebra
          # WM_CLASS 是 xin.dart.zebra(linux/runner/my_application.cc 里 g_set_prgname(APPLICATION_ID)),
          # 不加 StartupWMClass 则 GNOME 常驻台无法把窗口匹配到本 .desktop,显示默认齿轮图标
          StartupWMClass=xin.dart.zebra
          Terminal=false
          Categories=Network;Utility;
          EOF
          cat > "$ROOT/DEBIAN/control" << EOF
          Package: zebra
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Zebra <zebra@dart.xin>
          Installed-Size: $(du -sk "$ROOT/opt" | awk '{print $1}')
          Description: Zebra desktop application
          EOF
          # postinst:安装/升级后刷新图标缓存与桌面数据库,否则新装的图标不显示
          cat > "$ROOT/DEBIAN/postinst" << 'EOF'
          #!/bin/sh
          set -e
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -f /usr/share/icons/hicolor >/dev/null 2>&1 || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
          fi
          exit 0
          EOF
          chmod +x "$ROOT/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$ROOT" "zebra-linux-${VERSION}-x86_64.deb"

      - name: Build .rpm package
        run: |
          VERSION="${{ steps.pkgver.outputs.version }}"
          sudo apt-get install -y rpm > /dev/null
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          echo '%_topdir %(echo $HOME)/rpmbuild' > ~/.rpmmacros
          cat > ~/rpmbuild/SPECS/zebra.spec << EOF
          Name: zebra
          Version: $VERSION
          Release: 1
          Summary: Zebra desktop application
          License: MIT
          BuildArch: x86_64
          %description
          Zebra desktop application.
          %install
          mkdir -p %{buildroot}/opt/zebra
          cp -r $GITHUB_WORKSPACE/build/linux/x64/release/bundle/. %{buildroot}/opt/zebra/
          # 桌面入口(此前缺失,导致 rpm 安装后无启动器、无图标)
          mkdir -p %{buildroot}/usr/share/applications
          cat > %{buildroot}/usr/share/applications/zebra.desktop << 'DEOF'
          [Desktop Entry]
          Type=Application
          Name=Zebra
          Comment=Zebra Desktop App
          Exec=/opt/zebra/zebra
          Icon=zebra
          StartupWMClass=xin.dart.zebra
          Terminal=false
          Categories=Network;Utility;
          DEOF
          # 多尺寸 hicolor 图标(尺寸与目录匹配)
          for size in 16 24 32 48 64 128 256 512; do
            icon_file="$GITHUB_WORKSPACE/linux/icons/icon_\${size}.png"
            if [ -f "\$icon_file" ]; then
              mkdir -p %{buildroot}/usr/share/icons/hicolor/\${size}x\${size}/apps
              cp "\$icon_file" %{buildroot}/usr/share/icons/hicolor/\${size}x\${size}/apps/zebra.png
            fi
          done
          %post
          # 安装/升级后刷新图标缓存与桌面数据库
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -f /usr/share/icons/hicolor >/dev/null 2>&1 || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
          fi
          %files
          /opt/zebra/*
          /usr/share/applications/zebra.desktop
          /usr/share/icons/hicolor/*
          EOF
          rpmbuild -bb ~/rpmbuild/SPECS/zebra.spec
          cp ~/rpmbuild/RPMS/x86_64/zebra-*.rpm "zebra-linux-${VERSION}-x86_64.rpm"

      - name: Build .AppImage package
        run: |
          set -e
          VERSION="${{ steps.pkgver.outputs.version }}"
          BUNDLE="build/linux/x64/release/bundle"

          # 下载 linuxdeploy + GTK 插件 + appimagetool(CI 无 FUSE,统一用 --appimage-extract-and-run)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh appimagetool-x86_64.AppImage
          # linuxdeploy 从 PATH 中查找 linuxdeploy-plugin-gtk.sh
          export PATH="$PWD:$PATH"

          # 组装 AppDir:可执行文件进 usr/bin,Flutter 插件库进 usr/bin/lib
          # (linuxdeploy 生成的 AppRun 默认把 usr/lib 加入 LD_LIBRARY_PATH,GTK 库也部署于此)
          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin/lib" "$APPDIR/usr/lib" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          # Flutter 产物布局:bundle/zebra(可执行文件)+ bundle/data(资源)+ bundle/lib(运行时库),
          # 没有 bin/ 子目录;data 必须与可执行文件同级,引擎按 /proc/self/exe 所在目录查找。
          # 插件库必须放 usr/bin/lib:zebra 的 RUNPATH 是 $ORIGIN/lib(即可执行文件旁的 lib/),
          # linuxdeploy 按此解析依赖,若放 usr/lib 会报 "Could not find dependency: libxxx_plugin.so"
          cp "$BUNDLE"/zebra "$APPDIR/usr/bin/"
          cp -r "$BUNDLE"/data "$APPDIR/usr/bin/data"
          cp -r "$BUNDLE"/lib/* "$APPDIR/usr/bin/lib/"
          # 多尺寸 hicolor 图标(尺寸与目录匹配,此前 128x128 塞进 256x256 目录导致不显示)
          for size in 16 24 32 48 64 128 256 512; do
            if [ -f "linux/icons/icon_${size}.png" ]; then
              mkdir -p "$APPDIR/usr/share/icons/hicolor/${size}x${size}/apps"
              cp "linux/icons/icon_${size}.png" "$APPDIR/usr/share/icons/hicolor/${size}x${size}/apps/zebra.png"
            fi
          done

          cat > "$APPDIR/usr/share/applications/zebra.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Zebra
          Comment=Zebra Desktop App
          Exec=zebra
          Icon=zebra
          StartupWMClass=xin.dart.zebra
          Terminal=false
          Categories=Network;Utility;
          EOF

          # 部署依赖 + 把 GTK3 及资源(schemas/pixbuf/immodules/主题)打进 AppDir,
          # 同时生成标准 AppRun 和 apprun-hooks(由 AppRun 在运行时 source)
          DEPLOY_GTK_VERSION=3 ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir "$APPDIR" \
            --plugin gtk \
            --desktop-file "$APPDIR/usr/share/applications/zebra.desktop"

          ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            "$APPDIR" "zebra-linux-${VERSION}-x86_64.AppImage"

      - name: Build .tar.gz package
        run: |
          VERSION="${{ steps.pkgver.outputs.version }}"
          tar czf "zebra-linux-${VERSION}-x86_64.tar.gz" -C build/linux/x64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zebra-linux
          path: |
            packer/target/release/zebra-linux-*.zip
            zebra-linux-*.deb
            zebra-linux-*.rpm
            zebra-linux-*.AppImage
            zebra-linux-*.tar.gz

  # ==================== Windows ====================
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - name: Generate build info
        shell: bash
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > lib/build_info.dart << EOF
          // Auto-generated build info - overwritten by build scripts
          const String buildTime = '$BUILD_TIME';
          EOF

      - name: Flutter pub get
        shell: bash
        run: flutter pub get

      - name: Build Flutter Windows release
        shell: bash
        run: flutter build windows --release

      - name: Pack self-extracting exe
        shell: bash
        run: |
          cd packer
          cargo build --release --bin zebra-pack
          target/release/zebra-pack.exe -f ../build/windows/x64/runner/Release -e zebra.exe -n zebra-ssh
          cargo build --release --bin zebra

      - name: Prepare packaging version
        id: pkgver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          fi
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Rename self-extracting exe with version
        shell: bash
        run: |
          VERSION="${{ steps.pkgver.outputs.version }}"
          mv packer/target/release/zebra.exe "packer/target/release/zebra-windows-${VERSION}-x86_64.exe"

      - name: Build Inno Setup installer
        shell: bash
        run: |
          VERSION="${{ steps.pkgver.outputs.version }}"
          # 静默安装 Inno Setup(Windows 上最常见的安装器工具)
          choco install innosetup -y --no-progress > /dev/null 2>&1 || true
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            echo "::error::ISCC.exe not found after choco install innosetup"
            exit 1
          fi
          cat > zebra.iss << EOF
          [Setup]
          AppName=Zebra
          AppVersion=$VERSION
          AppPublisher=Zebra
          DefaultDirName={autopf}\Zebra
          DefaultGroupName=Zebra
          OutputDir=installer
          OutputBaseFilename=zebra-windows-$VERSION-x86_64-setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\zebra.exe
          SetupIconFile=windows\runner\resources\app_icon.ico

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs

          [Icons]
          Name: "{autoprograms}\Zebra"; Filename: "{app}\zebra.exe"
          Name: "{autodesktop}\Zebra"; Filename: "{app}\zebra.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\zebra.exe"; Description: "{cm:LaunchProgram,Zebra}"; Flags: nowait postinstall skipifsilent
          EOF
          "$ISCC" zebra.iss
          ls -la installer/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zebra-windows
          path: |
            packer/target/release/zebra-windows-*.exe
            installer/zebra-windows-*-setup.exe

  # ==================== Android ====================
  android:
    name: Android
    runs-on: ubuntu-latest
    # 单 job 连续跑 3 次 Gradle 构建(apk / 拆分 apk / aab),约 15~25 分钟;
    # 显式超时,避免 runner 卡死时默认 6h 才失败、白白烧掉分钟数
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Android NDK (sqlite3 native assets)
        run: |
          if [ ! -d "${ANDROID_SDK_ROOT}/ndk/27.0.12077973" ]; then
            echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
              --install "ndk;27.0.12077973" > /dev/null 2>&1 || true
          fi
          if [ -d "${ANDROID_SDK_ROOT}/ndk/27.0.12077973" ]; then
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          fi

      - name: Generate build info
        shell: bash
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > lib/build_info.dart << EOF
          // Auto-generated build info - overwritten by build scripts
          const String buildTime = '$BUILD_TIME';
          EOF

      - name: Flutter pub get
        shell: bash
        run: flutter pub get

      - name: Prepare packaging version
        id: pkgver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          fi
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Build Flutter Android APK
        shell: bash
        run: flutter build apk --release

      - name: Build Flutter Android APKs (split per ABI)
        shell: bash
        run: flutter build apk --release --split-per-abi

      - name: Build Flutter Android App Bundle
        shell: bash
        run: flutter build appbundle --release

      - name: Rename Android artifacts (zebra-android-<version>-<arch>)
        shell: bash
        run: |
          VERSION="${{ steps.pkgver.outputs.version }}"
          cd build/app/outputs/flutter-apk
          for f in app-*.apk; do
            # app-release.apk → zebra-android-<ver>-universal.apk(全 ABI 合一)
            # app-arm64-v8a-release.apk → zebra-android-<ver>-arm64-v8a.apk(按 ABI 拆分)
            abi="${f#app-}"
            abi="${abi%-release}"
            abi="${abi%.apk}"
            [ "$abi" = "release" ] && abi="universal"
            mv "$f" "zebra-android-${VERSION}-${abi}.apk"
          done
          if [ -f ../bundle/release/app-release.aab ]; then
            mv ../bundle/release/app-release.aab ../bundle/release/zebra-android-${VERSION}-universal.aab
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zebra-android-apk
          path: build/app/outputs/flutter-apk/zebra-*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: zebra-android-aab
          path: build/app/outputs/bundle/release/zebra-android-*.aab

  # ==================== macOS ====================
  # macOS runner 分钟数按 10 倍加权消耗私有仓库额度,平时 push 不构建;
  # 仅打 tag(发布 Release)或手动触发时才跑。
  # 采用真实 .app 方案:直接分发 Flutter 构建产物,不经 zebra-pack 自解压壳,
  # 保证 Dock 图标/代码签名/Gatekeeper/App Store 行为全部正常。
  macos:
    name: macOS
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate build info
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > lib/build_info.dart << EOF
          // Auto-generated build info - overwritten by build scripts
          const String buildTime = '$BUILD_TIME';
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare packaging version
        id: pkgver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          fi
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Build Flutter macOS release
        run: flutter build macos --release

      - name: Prepare Zebra.app bundle (real .app)
        run: |
          # 真实 .app 方案:直接使用 Flutter 构建产物 Runner.app,不经 zebra-pack 自解压壳,
          # 保证 Dock 图标/代码签名/Gatekeeper/商店行为全部正常。
          # 产物路径在不同 Flutter/Xcode 版本下可能有差异(CI 曾报 Runner.app 找不到),
          # 先按标准路径取,取不到则在 build/macos 下动态查找 .app,并打印实际路径便于排查
          APP_BUNDLE="build/macos/Build/Products/Release/Runner.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            APP_BUNDLE="$(find build/macos -maxdepth 6 -name '*.app' -type d 2>/dev/null | head -1)"
          fi
          if [ -z "$APP_BUNDLE" ] || [ ! -d "$APP_BUNDLE" ]; then
            echo "ERROR: macOS app bundle not found under build/macos" >&2
            find build/macos -maxdepth 6 2>/dev/null || echo "(build/macos does not exist)"
            exit 1
          fi
          echo "Using app bundle: $APP_BUNDLE"
          cp -R "$APP_BUNDLE" Zebra.app
          # 应用显示名与旧版自解压壳一致(真实产物 CFBundleName 为 Runner)
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Zebra SSH" Zebra.app/Contents/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Zebra SSH" Zebra.app/Contents/Info.plist
          # 生成卷宗图标:真实产物图标编译在 Assets.car 内,无独立 AppIcon.icns,
          # DMG 卷宗图标需要单独 .icns,从 AppIcon 源图生成(sips 缩放 + iconutil 合成)
          ICON_SRC="macos/Runner/Assets.xcassets/AppIcon.appiconset"
          TMP=".appicon.iconset"
          mkdir -p "$TMP"
          sips -z 16 16   "$ICON_SRC/app_icon_1024.png" --out "$TMP/icon_16x16.png"        2>/dev/null
          sips -z 32 32   "$ICON_SRC/app_icon_1024.png" --out "$TMP/icon_16x16@2x.png"     2>/dev/null
          sips -z 32 32   "$ICON_SRC/app_icon_1024.png" --out "$TMP/icon_32x32.png"        2>/dev/null
          sips -z 64 64   "$ICON_SRC/app_icon_1024.png" --out "$TMP/icon_32x32@2x.png"     2>/dev/null
          sips -z 128 128 "$ICON_SRC/app_icon_1024.png" --out "$TMP/icon_128x128.png"      2>/dev/null
          sips -z 256 256 "$ICON_SRC/app_icon_1024.png" --out "$TMP/icon_128x128@2x.png"   2>/dev/null
          sips -z 256 256 "$ICON_SRC/app_icon_1024.png" --out "$TMP/icon_256x256.png"      2>/dev/null
          sips -z 512 512 "$ICON_SRC/app_icon_1024.png" --out "$TMP/icon_256x256@2x.png"   2>/dev/null
          sips -z 512 512 "$ICON_SRC/app_icon_1024.png" --out "$TMP/icon_512x512.png"      2>/dev/null
          cp "$ICON_SRC/app_icon_1024.png" "$TMP/icon_512x512@2x.png"
          iconutil -c icns "$TMP" --output volume.icns
          rm -rf "$TMP"
          echo "Zebra.app ready: $(du -sh Zebra.app | cut -f1)"

      - name: Zip Zebra.app
        run: |
          zip -r zebra-macos-${{ steps.pkgver.outputs.version }}-arm64.zip Zebra.app

      - name: Create DMG
        run: |
          # 内嵌 .VolumeIcon.icns 卷宗图标,否则 dmg 文件/挂载卷显示系统默认磁盘图标
          STAGE="dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R Zebra.app "$STAGE/"
          cp volume.icns "$STAGE/.VolumeIcon.icns"
          hdiutil create \
            -volname "Zebra" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            zebra-macos-${{ steps.pkgver.outputs.version }}-arm64.dmg
          rm -rf "$STAGE"

      - name: Create PKG
        run: |
          # 生成原生 .pkg 安装器包(安装到 /Applications)
          pkgbuild \
            --component Zebra.app \
            --install-location /Applications \
            --identifier com.zebra.ssh \
            --version ${{ steps.pkgver.outputs.version }} \
            zebra-macos-${{ steps.pkgver.outputs.version }}-arm64.pkg

      # ==================== macOS x86_64(Intel) ====================
      # 说明:Flutter 3+ 的 `flutter build macos --release` 默认就产出 universal 二进制
      # (同时含 x86_64 + arm64,flutter_tools 对 release 用 generic/platform=macOS 目标),
      # 所以上面 arm64 流程打出的 Zebra.app 本身就支持 Intel,无需再构建 Flutter 或 Rust。
      # x64 版只是把同一份 universal 的 Zebra.app 复制一份按 x86_64 命名分发。
      - name: Prepare Zebra-x64.app bundle
        run: |
          # 内容与 arm64 版完全一致(universal 二进制),仅按 x86_64 命名
          cp -R Zebra.app Zebra-x64.app

      - name: Zip Zebra-x64.app
        run: |
          zip -r zebra-macos-${{ steps.pkgver.outputs.version }}-x86_64.zip Zebra-x64.app

      - name: Create x64 DMG
        run: |
          # 内嵌 .VolumeIcon.icns 卷宗图标,否则 dmg 文件/挂载卷显示系统默认磁盘图标
          STAGE="dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R Zebra-x64.app "$STAGE/"
          cp volume.icns "$STAGE/.VolumeIcon.icns"
          hdiutil create \
            -volname "Zebra" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            zebra-macos-${{ steps.pkgver.outputs.version }}-x86_64.dmg
          rm -rf "$STAGE"

      - name: Create x64 PKG
        run: |
          pkgbuild \
            --component Zebra-x64.app \
            --install-location /Applications \
            --identifier com.zebra.ssh \
            --version ${{ steps.pkgver.outputs.version }} \
            zebra-macos-${{ steps.pkgver.outputs.version }}-x86_64.pkg

      - name: Verify macOS architectures
        run: |
          # 真实 .app 方案的 Zebra.app 直接来自 Flutter 构建产物,
          # 必须是 universal(同时含 x86_64 + arm64),否则 x64 包在 Intel Mac 上无法运行,
          # 这里显式校验并报错
          for BIN in Zebra.app/Contents/MacOS/Runner Zebra-x64.app/Contents/MacOS/Runner; do
            if [ -f "$BIN" ]; then
              echo "== $BIN =="
              lipo -info "$BIN"
              if ! lipo -info "$BIN" | grep -q "x86_64"; then
                echo "ERROR: $BIN 不含 x86_64,Intel 包将无法运行,请检查 Flutter 构建配置" >&2
                exit 1
              fi
            else
              echo "ERROR: $BIN not found" >&2
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zebra-macos
          path: |
            zebra-macos-${{ steps.pkgver.outputs.version }}-arm64.zip
            zebra-macos-${{ steps.pkgver.outputs.version }}-arm64.dmg
            zebra-macos-${{ steps.pkgver.outputs.version }}-arm64.pkg
            zebra-macos-${{ steps.pkgver.outputs.version }}-x86_64.zip
            zebra-macos-${{ steps.pkgver.outputs.version }}-x86_64.dmg
            zebra-macos-${{ steps.pkgver.outputs.version }}-x86_64.pkg

  # ==================== iOS ====================
  # iOS 构建同样消耗 macOS runner 分钟数,与 macOS 一样只在打 tag 或手动触发时跑。
  # CI 无签名证书,产物为未签名 App,需本地签名后安装/上架。
  ios:
    name: iOS
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate build info
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > lib/build_info.dart << EOF
          // Auto-generated build info - overwritten by build scripts
          const String buildTime = '$BUILD_TIME';
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare packaging version
        id: pkgver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          fi
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Build Flutter iOS release (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Build Flutter iOS IPA (unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Zip Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r zebra-ios-${{ steps.pkgver.outputs.version }}-arm64.zip Runner.app

      - name: Rename IPA with version (if produced)
        run: |
          VERSION="${{ steps.pkgver.outputs.version }}"
          # flutter build ipa --no-codesign 在无签名证书的 CI 上可能不产出 .ipa
          # (flutter 在导出失败时仍返回成功),故找不到就跳过,不中断构建
          IPA="$(find build -name '*.ipa' -type f 2>/dev/null | head -1)"
          if [ -z "$IPA" ]; then
            echo "WARNING: no .ipa produced by flutter build ipa --no-codesign, skipping rename"
            exit 0
          fi
          DIR="$(dirname "$IPA")"
          mv "$IPA" "$DIR/zebra-ios-${VERSION}-arm64.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zebra-ios
          path: |
            build/ios/iphoneos/zebra-ios-*.zip
            build/**/zebra-ios-*.ipa

  # ==================== 发布 Release(仅打 tag 时) ====================
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android, ios]
    runs-on: ubuntu-latest
    # GITHUB_TOKEN 默认只读,创建 Release/生成 release notes 需要 contents: write;
    # 声明 permissions 后默认权限被覆盖,需一并给 actions: read 供 download-artifact 使用
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
