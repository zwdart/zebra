<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux 常用命令速查手册</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --dim: #94a3b8;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --green: #4ade80;
    --orange: #fb923c;
    --red: #f87171;
    --cmd-bg: #0c1322;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    color: var(--dim);
    margin-bottom: 30px;
    font-size: 0.95rem;
  }

  /* Search */
  .search-box {
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
  }
  .search-box input {
    width: 100%;
    max-width: 500px;
    padding: 12px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
  }
  .search-box input:focus {
    border-color: var(--accent);
  }
  .search-box input::placeholder {
    color: var(--dim);
  }

  /* Category */
  .category {
    margin-bottom: 28px;
  }
  .category-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
    padding-left: 4px;
    border-left: 3px solid var(--accent);
    padding-left: 12px;
  }

  /* Command card */
  .cmd-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .cmd-card:hover {
    border-color: var(--accent);
  }
  .cmd-header {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    cursor: pointer;
    user-select: none;
    gap: 12px;
  }
  .cmd-header:hover {
    background: rgba(56, 189, 248, 0.05);
  }
  .cmd-name {
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    color: var(--green);
    font-weight: 600;
    min-width: 140px;
    flex-shrink: 0;
  }
  .cmd-brief {
    color: var(--dim);
    flex: 1;
  }
  .cmd-arrow {
    color: var(--dim);
    font-size: 0.8rem;
    transition: transform .2s;
    flex-shrink: 0;
  }
  .cmd-card.open .cmd-arrow {
    transform: rotate(90deg);
  }

  /* Detail panel */
  .cmd-detail {
    display: none;
    padding: 0 16px 14px 16px;
    border-top: 1px solid var(--border);
  }
  .cmd-card.open .cmd-detail {
    display: block;
  }
  .cmd-detail pre {
    background: var(--cmd-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    margin-top: 8px;
    overflow-x: auto;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 0.88rem;
    line-height: 1.7;
    color: var(--text);
  }
  .cmd-detail .usage {
    color: var(--accent2);
    font-weight: 600;
    margin-top: 8px;
    font-size: 0.9rem;
  }
  .cmd-detail .note {
    color: var(--orange);
    font-size: 0.85rem;
    margin-top: 4px;
  }
  .cmd-detail .tag {
    display: inline-block;
    background: rgba(56,189,248,0.15);
    color: var(--accent);
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 0.78rem;
    margin-right: 4px;
  }
  .hidden { display: none !important; }

  /* Expand all button */
  .toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 16px;
    gap: 10px;
  }
  .toolbar button {
    background: var(--card);
    color: var(--dim);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all .2s;
  }
  .toolbar button:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  @media (max-width: 640px) {
    .cmd-name { min-width: 100px; font-size: 0.85rem; }
    .cmd-header { padding: 8px 10px; gap: 8px; }
    body { padding: 12px; }
  }
</style>
</head>

// Render
const app = document.getElementById('app');
let html = '';

data.forEach(cat => {
  html += `<div class="category" data-cat="${cat.cat}">`;
  html += `<div class="category-title">${cat.cat}</div>`;
  cat.cmds.forEach(cmd => {
    const id = cmd.name.replace(/[^a-zA-Z0-9]/g, '_');
    html += `<div class="cmd-card" data-name="${cmd.name.toLowerCase()}" data-brief="${cmd.brief.toLowerCase()}">`;
    html += `<div class="cmd-header" onclick="toggle('${id}')">`;
    html += `<span class="cmd-name">${cmd.name}</span>`;
    html += `<span class="cmd-brief">${cmd.brief}</span>`;
    html += `<span class="cmd-arrow">▶</span>`;
    html += `</div>`;
    html += `<div class="cmd-detail" id="d_${id}">${cmd.detail}</div>`;
    html += `</div>`;
  });
  html += `</div>`;
});

app.innerHTML = html;

function toggle(id) {
  const el = document.getElementById('d_' + id);
  el.closest('.cmd-card').classList.toggle('open');
}

function toggleAll(open) {
  document.querySelectorAll('.cmd-card').forEach(card => {
    card.classList.toggle('open', open);
  });
}

// Search
document.getElementById('search').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.cmd-card').forEach(card => {
    const name = card.dataset.name;
    const brief = card.dataset.brief;
    const match = !q || name.includes(q) || brief.includes(q) || card.textContent.toLowerCase().includes(q);
    card.classList.toggle('hidden', !match);
    if (q && match) card.classList.add('open');
  });
  document.querySelectorAll('.category').forEach(cat => {
    const hasVisible = cat.querySelector('.cmd-card:not(.hidden)');
    cat.classList.toggle('hidden', !hasVisible);
  });
});
</script>
